spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
      routes:
        - id: servicio-estudiantes
          uri: http://pad-estudiantes:8082
          predicates:
            - Path=/api/estudiantes/**,/api/auth/**,/api/usuarios/**,/api/apoderados/**,/api/documentos/**,/api/derivaciones/**,/api/fichas-medicas/**,/api/atenciones-medicas/**,/api/portal-apoderado/**,/api/auditoria/**,/api/consentimientos/**,/api/ingresos/**,/api/recuperacion/**,/api/institucion/**,/api/permisos/**,/api/nominas/**
          filters:
            - name: CircuitBreaker
              args:
                name: servicio-estudiantes
                fallbackUri: forward:/fallback/servicio-estudiantes
        - id: servicio-cursos
          uri: http://pad-cursos:8083
          predicates:
            - Path=/api/cursos/**,/api/asignaciones-academicas/**,/api/docentes/**,/api/tickets/**,/api/aulas/**,/api/niveles/**,/api/grados/**,/api/secciones/**,/api/periodos/**,/api/horarios/**
          filters:
            - name: CircuitBreaker
              args:
                name: servicio-cursos
                fallbackUri: forward:/fallback/servicio-cursos
        - id: servicio-evaluaciones
          uri: http://pad-evaluaciones:8084
          predicates:
            - Path=/api/notas/**,/api/asistencias/**,/api/bimestres/**
          filters:
            - name: CircuitBreaker
              args:
                name: servicio-evaluaciones
                fallbackUri: forward:/fallback/servicio-evaluaciones
        - id: servicio-disciplina
          uri: http://pad-disciplina:8081
          predicates:
            - Path=/api/disciplina/**,/api/reportes-disciplinarios/**
          filters:
            - name: CircuitBreaker
              args:
                name: servicio-disciplina
                fallbackUri: forward:/fallback/servicio-disciplina
        - id: servicio-reportes
          uri: http://pad-reportes:8085
          predicates:
            - Path=/api/reportes/**,/api/alertas/**,/api/estadisticas/**,/api/actividades/**,/api/integridad/**
          filters:
            - name: CircuitBreaker
              args:
                name: servicio-reportes
                fallbackUri: forward:/fallback/servicio-reportes
        - id: servicio-notificaciones
          uri: http://pad-notificaciones:8086
          predicates:
            - Path=/api/notificaciones/**
          filters:
            - name: CircuitBreaker
              args:
                name: servicio-notificaciones
                fallbackUri: forward:/fallback/servicio-notificaciones
        # Debe evaluarse antes que servicio-cursos, cuyo predicado /api/horarios/** también coincide.
        - id: servicio-horarios
          order: -1
          uri: http://pad-horarios:8088
          predicates:
            - Path=/api/horarios/generar,/api/horarios/detener,/api/horarios/estado,/api/horarios/resultado,/api/horarios/parametros
          filters:
            - name: CircuitBreaker
              args:
                name: servicio-horarios
                fallbackUri: forward:/fallback/servicio-horarios

