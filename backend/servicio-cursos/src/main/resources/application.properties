server.port=8083
spring.application.name=servicio-cursos

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AcademicoCursos;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optimizations
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10

# Redis se habilitará cuando se configure el contenedor
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
