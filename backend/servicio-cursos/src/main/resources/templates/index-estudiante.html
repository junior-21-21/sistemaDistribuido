<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head><meta charset="UTF-8"><title>Panel Estudiante</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 min-h-screen">
<aside th:replace="~{fragments/nav :: nav}"></aside>
<div class="ml-64 min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-40">
        <div>
            <h1 class="text-lg font-bold text-slate-800">
                Bienvenido, <span th:text="${usuarioLogueado != null ? usuarioLogueado.nombreCompleto : ''}"></span>
            </h1>
            <p class="text-xs text-slate-400">Panel del Estudiante</p>
        </div>
        <div th:if="${periodoAbierto}"
             class="flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
            <span th:text="${periodoAbierto.nombre}"></span> — ACTIVO
        </div>
        <div th:unless="${periodoAbierto}"
             class="flex items-center gap-2 bg-amber-50 border border-amber-200 text-amber-700 text-xs font-semibold px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 bg-amber-500 rounded-full"></span>
            Sin periodo abierto
        </div>
    </header>
    <main class="flex-1 p-6">

        <!-- Stat -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 max-w-sm">
            <div class="bg-white rounded-2xl p-5 border border-slate-200">
                <div class="w-9 h-9 bg-emerald-100 rounded-xl flex items-center justify-center mb-3">
                    <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <p class="text-2xl font-bold text-slate-800"
                   th:text="${misMatriculas != null ? misMatriculas.size() : 0}">0</p>
                <p class="text-xs text-slate-500 mt-0.5">Mis Matriculas</p>
            </div>
        </div>

        <!-- Tabla matriculas -->
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden mb-5">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <h2 class="text-sm font-bold text-slate-700">Mis Cursos Matriculados</h2>
                <a href="/mis-matriculas" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold transition">
                    Ver todas →
                </a>
            </div>
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-slate-800 text-slate-300 text-xs uppercase tracking-wide">
                        <th class="px-5 py-3 text-left font-semibold">#</th>
                        <th class="px-5 py-3 text-left font-semibold">Curso</th>
                        <th class="px-5 py-3 text-center font-semibold">Sec</th>
                        <th class="px-5 py-3 text-left font-semibold">Docente</th>
                        <th class="px-5 py-3 text-left font-semibold">Aula</th>
                        <th class="px-5 py-3 text-left font-semibold">Periodo</th>
                        <th class="px-5 py-3 text-center font-semibold">Estado</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr th:if="${misMatriculas == null or #lists.isEmpty(misMatriculas)}">
                        <td colspan="7" class="px-5 py-10 text-center text-slate-400">
                            No tienes matriculas registradas aun
                        </td>
                    </tr>
                    <tr th:each="m, i : ${misMatriculas}" class="hover:bg-slate-50 transition">
                        <td class="px-5 py-3 text-slate-400 text-xs" th:text="${i.count}"></td>
                        <td class="px-5 py-3 font-semibold text-slate-800"
                            th:text="${m.seccion.curso.nombre}"></td>
                        <td class="px-5 py-3 text-center">
                            <span class="bg-orange-50 text-orange-700 font-bold text-xs px-2 py-1 rounded-lg"
                                  th:text="${m.seccion.nombre}"></span>
                        </td>
                        <td class="px-5 py-3 text-slate-600"
                            th:text="${m.seccion.docente != null ? m.seccion.docente.nombreCompleto : '—'}"></td>
                        <td class="px-5 py-3 text-slate-600"
                            th:text="${m.seccion.aula != null ? m.seccion.aula.codigo : '—'}"></td>
                        <td class="px-5 py-3 text-slate-600"
                            th:text="${m.seccion.periodo.nombre}"></td>
                        <td class="px-5 py-3 text-center">
                            <span th:class="${m.estado == 'MATRICULADO'}
                                  ? 'bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded-full'
                                  : 'bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded-full'"
                                  th:text="${m.estado}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="/mis-matriculas"
           class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl transition text-sm w-fit">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Ver Todas Mis Matriculas
        </a>

    </main>
</div>
</body>
</html>
