server.port=8081
spring.application.name=servicio-disciplina

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/academico_disciplina}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
jwt.secret=${JWT_SECRET}
app.internal-api-key=${INTERNAL_API_KEY:${jwt.secret}}
services.notificaciones-url=${NOTIFICACIONES_URL:http://servicio-notificaciones:8086}
notifications.enabled=${NOTIFICATIONS_ENABLED:false}
services.reportes-url=${REPORTES_URL:http://localhost:8085}
services.cursos-url=${CURSOS_URL:http://localhost:8083}
activities.enabled=${ACTIVITIES_ENABLED:false}
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
