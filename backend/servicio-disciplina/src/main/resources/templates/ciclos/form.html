<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><title>Ciclo</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 min-h-screen">
<aside th:replace="~{fragments/nav :: nav}"></aside>
<div class="ml-64 min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center gap-3 sticky top-0 z-40">
        <a href="/ciclos" class="w-9 h-9 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center transition">
            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </a>
        <div>
            <h1 class="text-lg font-bold text-slate-800">Registrar Ciclo</h1>
            <p class="text-xs text-slate-400">Asigna un ciclo academico a una carrera</p>
        </div>
    </header>
    <main class="flex-1 p-6">
        <div class="max-w-xl">
            <div class="bg-white rounded-2xl border border-slate-200 p-6">
                <form th:action="@{/ciclos/guardar}" th:object="${ciclo}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}">
                    <div class="grid grid-cols-1 gap-5 mb-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">Carrera <span class="text-red-500">*</span></label>
                            <select th:field="*{carrera.id}" required
                                    th:class="${#fields.hasErrors('carrera')} ? 'w-full border-2 border-red-400 bg-red-50 rounded-xl px-4 py-3 text-sm focus:outline-none' : 'w-full border border-slate-200 bg-slate-50 rounded-xl px-4 py-3 text-sm focus:border-indigo-500 focus:bg-white focus:outline-none transition'">
                                <option value="">-- Seleccionar Carrera --</option>
                                <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre} + ' (max ' + ${c.totalCiclos} + ' ciclos)'"></option>
                            </select>
                            <p th:if="${#fields.hasErrors('carrera')}" class="text-red-500 text-xs mt-1.5" th:errors="*{carrera}"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">Numero de Ciclo <span class="text-red-500">*</span></label>
                            <input type="number" th:field="*{numeroCiclo}" min="1" max="10" required placeholder="Ingresa un numero del 1 al 10"
                                   th:class="${#fields.hasErrors('numeroCiclo')} ? 'w-full border-2 border-red-400 bg-red-50 rounded-xl px-4 py-3 text-sm focus:outline-none' : 'w-full border border-slate-200 bg-slate-50 rounded-xl px-4 py-3 text-sm focus:border-indigo-500 focus:bg-white focus:outline-none transition'">
                            <p class="text-xs text-slate-400 mt-1">Cada numero de ciclo solo puede usarse una vez por carrera</p>
                            <p th:if="${#fields.hasErrors('numeroCiclo')}" class="text-red-500 text-xs mt-1.5" th:errors="*{numeroCiclo}"></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 pt-4 border-t border-slate-100">
                        <button type="submit" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-xl transition text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            Guardar
                        </button>
                        <a href="/ciclos" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-6 py-2.5 rounded-xl transition text-sm">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
