server.port=8082
spring.application.name=servicio-estudiantes

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/academico_estudiantes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=${UPLOAD_DIR:uploads/documentos}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
app.seed-demo-data=${SEED_DEMO_DATA:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:director}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:director@localhost}
app.bootstrap-system-admin.username=${BOOTSTRAP_SYSTEM_ADMIN_USERNAME:admin}
app.bootstrap-system-admin.password=${BOOTSTRAP_SYSTEM_ADMIN_PASSWORD:}
app.bootstrap-system-admin.email=${BOOTSTRAP_SYSTEM_ADMIN_EMAIL:admin@localhost}
app.internal-api-key=${INTERNAL_API_KEY:${jwt.secret}}
services.evaluaciones-url=${EVALUACIONES_URL:http://servicio-evaluaciones:8084}
services.notificaciones-url=${NOTIFICACIONES_URL:http://servicio-notificaciones:8086}
notifications.enabled=${NOTIFICATIONS_ENABLED:false}
spring.jpa.open-in-view=false
services.cursos-url=${CURSOS_URL:http://localhost:8083}
data.consent.policy-version=${DATA_CONSENT_POLICY_VERSION:2026-01}
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Ingreso al colegio (porteria con DNI)
ingreso.zona-horaria=${INGRESO_ZONA_HORARIA:America/Lima}
ingreso.limite-manana=${INGRESO_LIMITE_MANANA:07:45}
ingreso.limite-tarde=${INGRESO_LIMITE_TARDE:13:45}
ingreso.cambio-turno=${INGRESO_CAMBIO_TURNO:12:30}
ingreso.notificar=${INGRESO_NOTIFICAR:TARDANZAS}
