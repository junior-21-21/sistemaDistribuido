<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Academico — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex">

    <!-- Panel izquierdo decorativo -->
    <div class="hidden lg:flex lg:w-1/2 bg-indigo-600 flex-col justify-between p-12">
        <div>
            <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center mb-8">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-white leading-tight mb-4">
                Sistema de<br>Gestion Academica
            </h1>
            <p class="text-indigo-200 text-lg">
                Administra carreras, ciclos, cursos, docentes, estudiantes y matriculas desde un solo lugar.
            </p>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div class="bg-white/10 rounded-2xl p-4 text-center">
                <p class="text-3xl font-bold text-white">3</p>
                <p class="text-indigo-200 text-xs mt-1">Roles</p>
            </div>
            <div class="bg-white/10 rounded-2xl p-4 text-center">
                <p class="text-3xl font-bold text-white">10</p>
                <p class="text-indigo-200 text-xs mt-1">Ciclos max</p>
            </div>
            <div class="bg-white/10 rounded-2xl p-4 text-center">
                <p class="text-3xl font-bold text-white">100%</p>
                <p class="text-indigo-200 text-xs mt-1">Web</p>
            </div>
        </div>
    </div>

    <!-- Panel derecho login -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white">
        <div class="w-full max-w-sm">

            <div class="mb-8">
                <h2 class="text-2xl font-bold text-slate-800">Iniciar Sesion</h2>
                <p class="text-slate-500 text-sm mt-1">Ingresa tus credenciales para acceder al sistema</p>
            </div>

            <!-- Alertas -->
            <div th:if="${error}"
                 class="flex items-center gap-3 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-5 text-sm">
                <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${error}"></span>
            </div>

            <div th:if="${mensaje}"
                 class="flex items-center gap-3 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl mb-5 text-sm">
                <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${mensaje}"></span>
            </div>

            <form th:action="@{/login}" method="post" novalidate>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                        Usuario <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <input type="text" name="username" required autofocus
                               placeholder="Ingresa tu usuario"
                               class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition bg-slate-50">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                        Contrasena <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <input type="password" name="password" required
                               placeholder="Ingresa tu contrasena"
                               class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition bg-slate-50">
                    </div>
                </div>

                <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold py-3 rounded-xl transition text-sm shadow-lg shadow-indigo-200">
                    Iniciar Sesion
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-100">
                <p class="text-xs text-slate-400 text-center mb-3">Roles disponibles en el sistema</p>
                <div class="flex justify-center gap-2">
                    <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold px-3 py-1 rounded-full">COORDINADOR</span>
                    <span class="bg-amber-50 text-amber-700 border border-amber-200 text-xs font-bold px-3 py-1 rounded-full">DOCENTE</span>
                    <span class="bg-sky-50 text-sky-700 border border-sky-200 text-xs font-bold px-3 py-1 rounded-full">ESTUDIANTE</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
