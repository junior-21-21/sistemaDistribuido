<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><title>Mis Estudiantes</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 min-h-screen">
<aside th:replace="~{fragments/nav :: nav}"></aside>
<div class="ml-64 min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-sky-100 rounded-xl flex items-center justify-center">
                <svg class="w-5 h-5 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold text-slate-800">Mis Estudiantes</h1>
                <p class="text-xs text-slate-400"
                   th:text="${docente != null ? docente.nombreCompleto : ''}"></p>
            </div>
        </div>
    </header>
    <main class="flex-1 p-6">
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-slate-800 text-slate-300 text-xs uppercase tracking-wide">
                        <th class="px-5 py-3.5 text-left font-semibold w-10">#</th>
                        <th class="px-5 py-3.5 text-left font-semibold">Estudiante</th>
                        <th class="px-5 py-3.5 text-left font-semibold">DNI</th>
                        <th class="px-5 py-3.5 text-left font-semibold">Email</th>
                        <th class="px-5 py-3.5 text-left font-semibold">Curso</th>
                        <th class="px-5 py-3.5 text-center font-semibold">Sec</th>
                        <th class="px-5 py-3.5 text-left font-semibold">Periodo</th>
                        <th class="px-5 py-3.5 text-center font-semibold">Estado</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr th:if="${matriculas == null or #lists.isEmpty(matriculas)}">
                        <td colspan="8" class="px-5 py-12 text-center text-slate-400">
                            No hay estudiantes en tus secciones
                        </td>
                    </tr>
                    <tr th:each="m, i : ${matriculas}" class="hover:bg-slate-50 transition">
                        <td class="px-5 py-3.5 text-slate-400 font-mono text-xs" th:text="${i.count}"></td>
                        <td class="px-5 py-3.5">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 bg-sky-100 rounded-full flex items-center justify-center text-sky-700 font-bold text-xs shrink-0"
                                     th:text="${#strings.substring(m.estudiante.nombre,0,1) + #strings.substring(m.estudiante.apellido,0,1)}"></div>
                                <span class="font-semibold text-slate-800"
                                      th:text="${m.estudiante.nombreCompleto}"></span>
                            </div>
                        </td>
                        <td class="px-5 py-3.5 font-mono text-slate-600 text-xs" th:text="${m.estudiante.dni}"></td>
                        <td class="px-5 py-3.5 text-slate-600" th:text="${m.estudiante.email}"></td>
                        <td class="px-5 py-3.5 text-slate-700" th:text="${m.seccion.curso.nombre}"></td>
                        <td class="px-5 py-3.5 text-center">
                            <span class="bg-orange-50 text-orange-700 font-bold text-xs px-2 py-1 rounded-lg"
                                  th:text="${m.seccion.nombre}"></span>
                        </td>
                        <td class="px-5 py-3.5 text-slate-600" th:text="${m.seccion.periodo.nombre}"></td>
                        <td class="px-5 py-3.5 text-center">
                            <span th:class="${m.estado == 'MATRICULADO'}
                                  ? 'bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded-full'
                                  : 'bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded-full'"
                                  th:text="${m.estado}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
