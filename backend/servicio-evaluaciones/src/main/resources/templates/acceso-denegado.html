<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
	<meta charset="UTF-8">
	<title>Acceso Denegado</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">
	<aside th:replace="~{fragments/nav :: nav}"></aside>
	<div class="ml-64 min-h-screen flex flex-col">
		<main class="flex-1 flex items-center justify-center p-6">
			<div class="text-center max-w-md">
				<div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
					<svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
					</svg>
				</div>
				<h1 class="text-3xl font-bold text-slate-800 mb-3">Acceso Denegado</h1>
				<p class="text-slate-500 mb-8">No tienes permisos para acceder a esta seccion del sistema.</p>
				<a href="/"
					class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M10 19l-7-7m0 0l7-7m-7 7h18" />
					</svg>
					Volver al Inicio
				</a>
			</div>
		</main>
	</div>
</body>

</html>
