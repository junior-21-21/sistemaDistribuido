server.port=8088
spring.application.name=servicio-horarios

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/academico_cursos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
jwt.secret=${JWT_SECRET}
app.internal-api-key=${INTERNAL_API_KEY:${jwt.secret}}
app.seed-demo-data=${SEED_DEMO_DATA:false}
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Pool acotado: 8 servicios comparten un PostgreSQL con max_connections=100
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Redis se habilitará cuando se configure el contenedor
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
