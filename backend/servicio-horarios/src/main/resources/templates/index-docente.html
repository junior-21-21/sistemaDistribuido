<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
	<meta charset="UTF-8">
	<title>Panel Docente</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">
	<aside th:replace="~{fragments/nav :: nav}"></aside>
	<div class="ml-64 min-h-screen flex flex-col">
		<header
			class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-40">
			<div>
				<h1 class="text-lg font-bold text-slate-800">
					Bienvenido, <span th:text="${usuarioLogueado != null ? usuarioLogueado.nombreCompleto : ''}"></span>
				</h1>
				<p class="text-xs text-slate-400">Panel del Docente</p>
			</div>
			<div th:if="${periodoAbierto}"
				class="flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold px-3 py-1.5 rounded-full">
				<span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
				<span th:text="${periodoAbierto.nombre}"></span> — ACTIVO
			</div>
			<div th:unless="${periodoAbierto}"
				class="flex items-center gap-2 bg-amber-50 border border-amber-200 text-amber-700 text-xs font-semibold px-3 py-1.5 rounded-full">
				<span class="w-2 h-2 bg-amber-500 rounded-full"></span>
				Sin periodo abierto
			</div>
		</header>
		<main class="flex-1 p-6">

			<!-- Stats -->
			<div class="grid grid-cols-2 gap-4 mb-6">
				<div class="bg-white rounded-2xl p-5 border border-slate-200">
					<div class="w-9 h-9 bg-orange-100 rounded-xl flex items-center justify-center mb-3">
						<svg class="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
						</svg>
					</div>
					<p class="text-2xl font-bold text-slate-800"
						th:text="${misSecciones != null ? misSecciones.size() : 0}">0</p>
					<p class="text-xs text-slate-500 mt-0.5">Secciones Asignadas</p>
				</div>
				<div class="bg-white rounded-2xl p-5 border border-slate-200">
					<div class="w-9 h-9 bg-sky-100 rounded-xl flex items-center justify-center mb-3">
						<svg class="w-5 h-5 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
						</svg>
					</div>
					<p class="text-2xl font-bold text-slate-800" th:text="${totalEstudiantes}">0</p>
					<p class="text-xs text-slate-500 mt-0.5">Mis Estudiantes</p>
				</div>
			</div>

			<!-- Tabla secciones -->
			<div class="bg-white rounded-2xl border border-slate-200 overflow-hidden mb-5">
				<div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
					<h2 class="text-sm font-bold text-slate-700">Mis Secciones Asignadas</h2>
					<a href="/mi-horario"
						class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold transition">
						Ver horario completo →
					</a>
				</div>
				<table class="w-full text-sm">
					<thead>
						<tr class="bg-slate-800 text-slate-300 text-xs uppercase tracking-wide">
							<th class="px-5 py-3 text-left font-semibold">#</th>
							<th class="px-5 py-3 text-left font-semibold">Curso</th>
							<th class="px-5 py-3 text-center font-semibold">Sec</th>
							<th class="px-5 py-3 text-left font-semibold">Aula</th>
							<th class="px-5 py-3 text-left font-semibold">Periodo</th>
							<th class="px-5 py-3 text-center font-semibold">Cupo</th>
						</tr>
					</thead>
					<tbody class="divide-y divide-slate-100">
						<tr th:if="${misSecciones == null or #lists.isEmpty(misSecciones)}">
							<td colspan="6" class="px-5 py-10 text-center text-slate-400">
								No tienes secciones asignadas aun
							</td>
						</tr>
						<tr th:each="s, i : ${misSecciones}" class="hover:bg-slate-50 transition">
							<td class="px-5 py-3 text-slate-400 text-xs" th:text="${i.count}"></td>
							<td class="px-5 py-3 font-semibold text-slate-800" th:text="${s.curso.nombre}"></td>
							<td class="px-5 py-3 text-center">
								<span class="bg-orange-50 text-orange-700 font-bold text-xs px-2 py-1 rounded-lg"
									th:text="${s.nombre}"></span>
							</td>
							<td class="px-5 py-3 text-slate-600" th:text="${s.aula != null ? s.aula.codigo : '—'}"></td>
							<td class="px-5 py-3">
								<span th:class="${s.periodo.estado == 'ABIERTO'}
                                  ? 'bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded-full'
                                  : 'bg-slate-100 text-slate-600 text-xs font-bold px-2 py-1 rounded-full'"
									th:text="${s.periodo.nombre}"></span>
							</td>
							<td class="px-5 py-3 text-center">
								<div class="flex items-center justify-center gap-1">
									<div class="w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden">
										<div class="h-full bg-indigo-500 rounded-full"
											th:style="'width:' + ${s.cupoMaximo > 0 ? (s.cupoOcupado * 100 / s.cupoMaximo) : 0} + '%'">
										</div>
									</div>
									<span class="text-xs text-slate-500"
										th:text="${s.cupoOcupado} + '/' + ${s.cupoMaximo}"></span>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- Accesos rapidos -->
			<div class="flex gap-3 flex-wrap">
				<a href="/mi-horario"
					class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl transition text-sm">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
					</svg>
					Ver Mi Horario
				</a>
				<a href="/mis-estudiantes"
					class="flex items-center gap-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-semibold px-5 py-2.5 rounded-xl transition text-sm">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
					</svg>
					Ver Mis Estudiantes
				</a>
			</div>

		</main>
	</div>
</body>

</html>
