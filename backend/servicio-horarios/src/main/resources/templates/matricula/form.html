<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><title>Nueva Matricula</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 min-h-screen">
<aside th:replace="~{fragments/nav :: nav}"></aside>
<div class="ml-64 min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center gap-3 sticky top-0 z-40">
        <a href="/matriculas" class="w-9 h-9 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center transition"><svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg></a>
        <div><h1 class="text-lg font-bold text-slate-800">Nueva Matricula</h1><p class="text-xs text-slate-400">Inscribir estudiante en una seccion</p></div>
    </header>
    <main class="flex-1 p-6">
        <div class="max-w-xl">
            <div class="flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl mb-5 text-sm">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shrink-0"></span>
                Periodo activo: <strong class="ml-1" th:text="${periodoAbierto.nombre}"></strong>
                — Solo se muestran secciones de este periodo.
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 p-6">
                <form th:action="@{/matriculas/guardar}" method="post" novalidate onsubmit="return validarMatricula()">
                    <div class="grid grid-cols-1 gap-5 mb-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">Estudiante <span class="text-red-500">*</span></label>
                            <select name="estudianteId" id="estudianteId" required
                                    class="w-full border border-slate-200 bg-slate-50 rounded-xl px-4 py-3 text-sm focus:border-indigo-500 focus:bg-white focus:outline-none transition">
                                <option value="">-- Seleccionar Estudiante --</option>
                                <option th:each="e : ${estudiantes}" th:value="${e.id}"
                                        th:text="${e.nombreCompleto} + ' — DNI: ' + ${e.dni}"></option>
                            </select>
                            <p id="errEst" class="hidden text-red-500 text-xs mt-1.5">Debe seleccionar un estudiante</p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">Seccion <span class="text-red-500">*</span> <span class="normal-case font-normal text-slate-400">(periodo activo)</span></label>
                            <select name="seccionId" id="seccionId" required
                                    class="w-full border border-slate-200 bg-slate-50 rounded-xl px-4 py-3 text-sm focus:border-indigo-500 focus:bg-white focus:outline-none transition">
                                <option value="">-- Seleccionar Seccion --</option>
                                <option th:each="s : ${secciones}" th:value="${s.id}"
                                        th:text="${s.curso.nombre} + ' — Sec: ' + ${s.nombre} + ' — Cupo libre: ' + ${s.cupoDisponible}"></option>
                            </select>
                            <p id="errSec" class="hidden text-red-500 text-xs mt-1.5">Debe seleccionar una seccion</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 pt-4 border-t border-slate-100">
                        <button type="submit" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-xl transition text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            Matricular
                        </button>
                        <a href="/matriculas" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-6 py-2.5 rounded-xl transition text-sm">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script>
function validarMatricula() {
    let ok = true;
    const est = document.getElementById('estudianteId');
    const sec = document.getElementById('seccionId');
    const eE  = document.getElementById('errEst');
    const eS  = document.getElementById('errSec');
    if (!est.value) { eE.classList.remove('hidden'); est.classList.add('border-red-400', 'bg-red-50'); ok = false; }
    else            { eE.classList.add('hidden');    est.classList.remove('border-red-400', 'bg-red-50'); }
    if (!sec.value) { eS.classList.remove('hidden'); sec.classList.add('border-red-400', 'bg-red-50'); ok = false; }
    else            { eS.classList.add('hidden');    sec.classList.remove('border-red-400', 'bg-red-50'); }
    return ok;
}
</script>
</body>
</html>
