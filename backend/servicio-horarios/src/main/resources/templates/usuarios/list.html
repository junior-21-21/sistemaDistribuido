<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
	<meta charset="UTF-8">
	<title>Usuarios</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">
	<aside th:replace="~{fragments/nav :: nav}"></aside>
	<div class="ml-64 min-h-screen flex flex-col">
		<header
			class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-40">
			<div class="flex items-center gap-3">
				<div class="w-9 h-9 bg-slate-200 rounded-xl flex items-center justify-center">
					<svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
					</svg>
				</div>
				<div>
					<h1 class="text-lg font-bold text-slate-800">Usuarios del Sistema</h1>
					<p class="text-xs text-slate-400">Cuentas de acceso por rol</p>
				</div>
			</div>
			<a href="/usuarios/nuevo"
				class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition">
				<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
				</svg>
				Nuevo Usuario
			</a>
		</header>
		<main class="flex-1 p-6">
			<div th:if="${success}"
				class="flex items-center gap-3 bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl mb-4 text-sm">
				<svg class="w-5 h-5 text-emerald-500 shrink-0" fill="currentColor" viewBox="0 0 20 20">
					<path fill-rule="evenodd"
						d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
						clip-rule="evenodd" />
				</svg>
				<span th:text="${success}"></span>
			</div>
			<div th:if="${error}"
				class="flex items-center gap-3 bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-xl mb-4 text-sm">
				<svg class="w-5 h-5 text-red-500 shrink-0" fill="currentColor" viewBox="0 0 20 20">
					<path fill-rule="evenodd"
						d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
						clip-rule="evenodd" />
				</svg>
				<span th:text="${error}"></span>
			</div>

			<div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
				<table class="w-full text-sm">
					<thead>
						<tr class="bg-slate-800 text-slate-300 text-xs uppercase tracking-wide">
							<th class="px-5 py-3.5 text-left font-semibold w-10">#</th>
							<th class="px-5 py-3.5 text-left font-semibold">Username</th>
							<th class="px-5 py-3.5 text-left font-semibold">Nombre</th>
							<th class="px-5 py-3.5 text-left font-semibold">Email</th>
							<th class="px-5 py-3.5 text-center font-semibold">Rol</th>
							<th class="px-5 py-3.5 text-left font-semibold">Vinculado a</th>
							<th class="px-5 py-3.5 text-center font-semibold">Estado</th>
							<th class="px-5 py-3.5 text-right font-semibold">Acciones</th>
						</tr>
					</thead>
					<tbody class="divide-y divide-slate-100">
						<tr th:if="${#lists.isEmpty(usuarios)}">
							<td colspan="8" class="px-5 py-12 text-center text-slate-400">
								No hay usuarios registrados
							</td>
						</tr>
						<tr th:each="u, i : ${usuarios}" class="hover:bg-slate-50 transition">
							<td class="px-5 py-3.5 text-slate-400 font-mono text-xs" th:text="${i.count}"></td>
							<td class="px-5 py-3.5">
								<div class="flex items-center gap-3">
									<div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
										th:class="${u.rol == 'COORDINADOR'} ? 'bg-emerald-100 text-emerald-700'
                                              : (${u.rol == 'DOCENTE'}   ? 'bg-amber-100 text-amber-700'
                                              : 'bg-sky-100 text-sky-700')"
										th:text="${#strings.substring(u.username,0,1).toUpperCase()}">
									</div>
									<span class="font-mono font-semibold text-slate-700" th:text="${u.username}"></span>
								</div>
							</td>
							<td class="px-5 py-3.5 font-medium text-slate-800" th:text="${u.nombreCompleto}"></td>
							<td class="px-5 py-3.5 text-slate-500" th:text="${u.email}"></td>
							<td class="px-5 py-3.5 text-center">
								<span th:class="${u.rol == 'COORDINADOR'} ? 'bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded-full'
                                           : (${u.rol == 'DOCENTE'}   ? 'bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded-full'
                                           : 'bg-sky-100 text-sky-700 text-xs font-bold px-2 py-1 rounded-full')"
									th:text="${u.rol}"></span>
							</td>
							<td class="px-5 py-3.5 text-slate-500 text-xs">
								<span th:if="${u.docente != null}" class="flex items-center gap-1">
									<svg class="w-3 h-3 text-teal-500" fill="currentColor" viewBox="0 0 20 20">
										<path fill-rule="evenodd"
											d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
											clip-rule="evenodd" />
									</svg>
									<span th:text="${u.docente.nombreCompleto}"></span>
								</span>
								<span th:if="${u.estudiante != null}" class="flex items-center gap-1">
									<svg class="w-3 h-3 text-sky-500" fill="currentColor" viewBox="0 0 20 20">
										<path fill-rule="evenodd"
											d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
											clip-rule="evenodd" />
									</svg>
									<span th:text="${u.estudiante.nombreCompleto}"></span>
								</span>
								<span th:if="${u.docente == null and u.estudiante == null}"
									class="text-slate-300">—</span>
							</td>
							<td class="px-5 py-3.5 text-center">
								<span th:class="${u.estado == 'ACTIVO'}
                                  ? 'bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded-full'
                                  : 'bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded-full'"
									th:text="${u.estado}"></span>
							</td>
							<td class="px-5 py-3.5 text-right">
								<a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}"
									class="flex items-center gap-1 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold px-3 py-1.5 rounded-lg transition inline-flex"
									onclick="return confirm('¿Eliminar este usuario? Esta accion no se puede deshacer.')">
									<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
										<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
											d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
									</svg>
									Eliminar
								</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</main>
	</div>
</body>
</html>
