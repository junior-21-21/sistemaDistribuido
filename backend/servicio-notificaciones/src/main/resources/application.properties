spring.application.name=servicio-notificaciones
server.port=8086

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/academico_notificaciones}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:pad}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pad}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

jwt.secret=${JWT_SECRET}
app.internal-api-key=${INTERNAL_API_KEY:${jwt.secret}}
services.estudiantes-url=${ESTUDIANTES_URL:http://servicio-estudiantes:8082}
notifications.mode=${NOTIFICATIONS_MODE:SIMULATED}
notifications.retry-scan-ms=${NOTIFICATIONS_RETRY_SCAN_MS:30000}
notifications.email.webhook-url=${NOTIFICATIONS_EMAIL_WEBHOOK_URL:}
notifications.sms.webhook-url=${NOTIFICATIONS_SMS_WEBHOOK_URL:}
notifications.whatsapp.webhook-url=${NOTIFICATIONS_WHATSAPP_WEBHOOK_URL:}
notifications.webhook-token=${NOTIFICATIONS_WEBHOOK_TOKEN:}
notifications.required-channels=${NOTIFICATIONS_REQUIRED_CHANNELS:EMAIL,SMS,WHATSAPP}
notifications.allow-insecure-http=${NOTIFICATIONS_ALLOW_INSECURE_HTTP:false}
notifications.connect-timeout-ms=${NOTIFICATIONS_CONNECT_TIMEOUT_MS:5000}
notifications.read-timeout-ms=${NOTIFICATIONS_READ_TIMEOUT_MS:10000}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}] 
