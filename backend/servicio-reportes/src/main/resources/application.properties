server.port=8085
spring.application.name=servicio-reportes

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/academico_reportes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}
app.internal-api-key=${INTERNAL_API_KEY:${jwt.secret}}
integridad.initial-delay-ms=${INTEGRIDAD_INITIAL_DELAY_MS:90000}
integridad.interval-ms=${INTEGRIDAD_INTERVAL_MS:21600000}

# URLs de los microservicios para consultas cross-service
servicio.estudiantes.url=${ESTUDIANTES_URL:http://localhost:8082}
servicio.cursos.url=${CURSOS_URL:http://localhost:8083}
servicio.evaluaciones.url=${EVALUACIONES_URL:http://localhost:8084}
servicio.disciplina.url=${DISCIPLINA_URL:http://localhost:8081}

spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
