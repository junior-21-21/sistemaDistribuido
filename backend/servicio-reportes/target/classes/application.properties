server.port=8085
spring.application.name=servicio-reportes

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AcademicoReportes;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# URLs de los microservicios para consultas cross-service
servicio.estudiantes.url=${ESTUDIANTES_URL:http://localhost:8082}
servicio.evaluaciones.url=${EVALUACIONES_URL:http://localhost:8084}
servicio.disciplina.url=${DISCIPLINA_URL:http://localhost:8081}

spring.web.cors.allowed-origins=http://localhost:4200
