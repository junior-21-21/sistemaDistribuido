# Límite de intentos de login por IP (protección básica contra fuerza bruta).
# Holgado porque un colegio suele salir a internet con una sola IP pública (NAT).
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;

server {
    listen 80;

    # DNS interno de Docker: si el gateway se reinicia y cambia de IP, nginx la vuelve a
    # resolver en lugar de seguir usando la antigua ("connection refused").
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://pad-api-gateway:8080;
    server_name localhost sistemadistribuido2026.com www.sistemadistribuido2026.com;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Los documentos de estudiantes aceptan hasta 10 MB en el backend.
    client_max_body_size 12m;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Cabeceras de seguridad. Se repiten en cada location que define add_header,
    # porque nginx no hereda las del nivel server en ese caso.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # No cachear index.html ni Service Worker para evitar stale cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Angular SPA — redirige 404s al index.html para client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /api/auth/login {
        limit_req zone=login_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canal en tiempo real (Server-Sent Events): sin buffer y con conexión larga.
    location ^~ /api/tiempo-real/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Proxy API al API Gateway
    location ^~ /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Caché para assets estáticos (JS/CSS con hash en nombre)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
