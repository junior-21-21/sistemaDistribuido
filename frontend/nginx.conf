server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # No cachear index.html ni Service Worker para evitar stale cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Angular SPA — redirige 404s al index.html para client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        # Evitar caché en el HTML base independientemente de la ruta
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Proxy API al API Gateway
    location /api/ {
        proxy_pass http://pad-api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI directo a cada microservicio
    location /swagger/estudiantes/ {
        proxy_pass http://pad-estudiantes:8082/;
    }
    location /swagger/cursos/ {
        proxy_pass http://pad-cursos:8083/;
    }
    location /swagger/evaluaciones/ {
        proxy_pass http://pad-evaluaciones:8084/;
    }
    location /swagger/disciplina/ {
        proxy_pass http://pad-disciplina:8081/;
    }
    location /swagger/reportes/ {
        proxy_pass http://pad-reportes:8085/;
    }

    # Caché para assets estáticos (JS/CSS con hash en nombre)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
