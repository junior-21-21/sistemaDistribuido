<div class="glass-dock-wrapper">
  <nav class="glass-dock" [style.--total]="menuItems.length" [style.--active-index]="activeIndex">
    <!-- Active Indicator Pill -->
    <div class="indicator"></div>
    
    <ul class="nav-list">
      @for (item of menuItems; track item.path; let i = $index) {
        <li class="nav-item" [class.active]="activeIndex === i">
          <a [routerLink]="item.path" class="nav-link">
            <span class="nav-icon">
              <i class="bi" [class]="item.icon"></i>
            </span>
            <span class="nav-text">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
