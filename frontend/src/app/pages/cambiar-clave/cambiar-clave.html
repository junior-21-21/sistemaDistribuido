<main class="password-page">
  <section class="glass-panel password-card p-4 p-md-5">
    <div class="password-icon mb-3"><i class="bi bi-shield-lock"></i></div>
    <h1 class="h3 fw-bold mb-2">Actualiza tu clave</h1>
    <p class="text-muted mb-4">Tu cuenta usa una clave temporal. Debes reemplazarla antes de continuar.</p>

    @if (error) {
      <div class="alert alert-danger small" role="alert">{{ error }}</div>
    }
    @if (success) {
      <div class="alert alert-success small" role="alert">{{ success }}</div>
    }

    <form #claveForm="ngForm" (ngSubmit)="cambiar()">
      <div class="mb-3">
        <label class="form-label">Clave temporal actual</label>
        <div class="input-group">
          <input class="form-control" [type]="mostrarClaveActual ? 'text' : 'password'" name="claveActual" [(ngModel)]="claveActual" required autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" (click)="mostrarClaveActual = !mostrarClaveActual" aria-label="Mostrar contraseña">
            <i class="bi" [ngClass]="mostrarClaveActual ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Nueva clave</label>
        <div class="input-group">
          <input class="form-control" [type]="mostrarNuevaClave ? 'text' : 'password'" name="nuevaClave" [(ngModel)]="nuevaClave" required minlength="4" autocomplete="new-password">
          <button class="btn btn-outline-secondary" type="button" (click)="mostrarNuevaClave = !mostrarNuevaClave" aria-label="Mostrar contraseña">
            <i class="bi" [ngClass]="mostrarNuevaClave ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <div class="form-text">Mínimo 4 caracteres.</div>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirmar nueva clave</label>
        <div class="input-group">
          <input class="form-control" [type]="mostrarConfirmarClave ? 'text' : 'password'" name="confirmarClave" [(ngModel)]="confirmarClave" required autocomplete="new-password">
          <button class="btn btn-outline-secondary" type="button" (click)="mostrarConfirmarClave = !mostrarConfirmarClave" aria-label="Mostrar contraseña">
            <i class="bi" [ngClass]="mostrarConfirmarClave ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        @if (confirmarClave && nuevaClave !== confirmarClave) {
          <div class="text-danger small mt-1">Las claves no coinciden.</div>
        }
      </div>
      <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit" [disabled]="!formularioValido() || submitting">
        {{ submitting && !success ? 'Actualizando…' : 'Guardar nueva clave' }}
      </button>
    </form>
  </section>
</main>
